plugins {
    id 'java'
    id 'slime-core' version '1.0-SNAPSHOT'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of("21")
    }

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Neoforged'
        url = 'https://maven.neoforged.net/releases/'
    }
    maven {
        name = "Forge"
        url = "https://maven.minecraftforge.net"
    }
}

dependencies {
    puzzleLoader 'dev.puzzleshq:puzzle-loader-core:1.4.5-alpha'
//    puzzleLoader 'dev.puzzleshq:puzzle-loader-core:69.69.69-alpha'
    implementation "net.minecraftforge:eventbus:2.2.1"
}

